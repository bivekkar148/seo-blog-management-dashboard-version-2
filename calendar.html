<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Publishing Calendar | SEO Blog Dashboard
    </title>


    <!-- Main Project CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">


    <!-- Responsive CSS -->

    <link
        rel="stylesheet"
        href="css/responsive.css">


    <!-- Calendar CSS -->

    <link
        rel="stylesheet"
        href="css/calendar.css">

</head>


<body>


<main class="page-container">


    <!-- =========================================
         PAGE HEADER
    ========================================= -->

    <div class="page-header">

        <div>

            <h1>
                Publishing Calendar
            </h1>

            <p>
                View and manage scheduled blog publishing dates.
            </p>

        </div>


        <div class="blog-header-actions">

            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='index.html'">

                ← Dashboard

            </button>


            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='blogs.html'">

                📝 Blog Management

            </button>


            <button
                type="button"
                class="primary-btn"
                onclick="window.location.href='writer.html'">

                + Write New Blog

            </button>

        </div>

    </div>



    <!-- =========================================
         CALENDAR
    ========================================= -->

    <section class="dashboard-panel">


        <div class="dashboard-panel-header">

            <div>

                <h2>
                    Blog Publishing Schedule
                </h2>

                <p>
                    View your blogs according to their publishing dates.
                </p>

            </div>

        </div>


        <div id="calendar">


            <!-- =================================
                 CALENDAR NAVIGATION
            ================================= -->

            <div id="calendar-header">


                <button
                    type="button"
                    id="prevMonth"
                    class="secondary-btn">

                    ← Previous

                </button>


                <h2 id="currentMonth">
                    Calendar
                </h2>


                <button
                    type="button"
                    id="nextMonth"
                    class="secondary-btn">

                    Next →

                </button>


            </div>



            <!-- =================================
                 CALENDAR DAYS
            ================================= -->

            <div
                id="calendarDays"
                class="calendar-days">

                <!-- Generated by calendar.js -->

            </div>


        </div>

    </section>



    <!-- =========================================
         UPCOMING BLOGS
    ========================================= -->

    <section class="dashboard-panel">


        <div class="dashboard-panel-header">

            <div>

                <h2>
                    Upcoming Publishing Schedule
                </h2>

                <p>
                    Blogs arranged according to their publishing dates.
                </p>

            </div>

        </div>


        <div id="upcomingBlogs">

            <p>
                Loading schedule...
            </p>

        </div>

    </section>


</main>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/storage.js"></script>

<script src="js/app.js"></script>

<script src="js/calendar.js"></script>


</body>

</html>
