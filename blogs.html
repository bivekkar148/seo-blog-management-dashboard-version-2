<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Management | SEO Blog Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

<main class="page-container">


    <!-- =========================================
         PAGE HEADER
    ========================================= -->

    <div class="page-header">

        <div>

            <h1>
                Blog Management
            </h1>

            <p>
                Create, manage, edit and organise your SEO blog content.
            </p>

        </div>


        <div class="blog-header-actions">

            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='index.html'">

                ← Dashboard

            </button>


            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='calendar.html'">

                📅 Calendar

            </button>


            <button
                type="button"
                class="primary-btn"
                onclick="window.location.href='writer.html'">

                + Write New Blog

            </button>

        </div>

    </div>



    <!-- =========================================
         ADD / EDIT BLOG INFORMATION
    ========================================= -->

    <div
        id="blogFormContainer"
        class="blog-form-card"
        style="display: none;">


        <div class="form-header">

            <h2>
                Blog Information
            </h2>

            <p>
                Update the basic information for your blog article.
            </p>

        </div>


        <form id="blogForm">

            <div class="form-grid">


                <div class="form-group full-width">

                    <label for="blogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="blogTitle"
                        placeholder="Enter blog title"
                        required>

                </div>


                <div class="form-group">

                    <label for="blogKeyword">
                        Primary SEO Keyword
                    </label>

                    <input
                        type="text"
                        id="blogKeyword"
                        placeholder="Enter primary keyword"
                        required>

                </div>


                <div class="form-group">

                    <label for="blogCategory">
                        Category
                    </label>

                    <select
                        id="blogCategory"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="SEO">
                            SEO
                        </option>

                        <option value="Content Marketing">
                            Content Marketing
                        </option>

                        <option value="Technical SEO">
                            Technical SEO
                        </option>

                        <option value="Digital Marketing">
                            Digital Marketing
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="blogWriter">
                        Writer
                    </label>

                    <input
                        type="text"
                        id="blogWriter"
                        placeholder="Enter writer name"
                        required>

                </div>


                <div class="form-group">

                    <label for="wordCount">
                        Word Count
                    </label>

                    <input
                        type="number"
                        id="wordCount"
                        min="1"
                        placeholder="Enter word count"
                        required>

                </div>


                <div class="form-group">

                    <label for="publishDate">
                        Publishing Date
                    </label>

                    <input
                        type="date"
                        id="publishDate"
                        required>

                </div>


                <div class="form-group">

                    <label for="blogStatus">
                        Status
                    </label>

                    <select
                        id="blogStatus"
                        required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Idea">
                            Idea
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Under Review">
                            Under Review
                        </option>

                        <option value="Scheduled">
                            Scheduled
                        </option>

                        <option value="Published">
                            Published
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn">

                    Update Blog

                </button>


                <button
                    type="button"
                    id="cancelBlogBtn"
                    class="secondary-btn">

                    Cancel

                </button>

            </div>

        </form>

    </div>



    <!-- =========================================
         BLOG CONTROLS
    ========================================= -->

    <section class="blog-controls">

        <div class="search-wrapper">

            <input
                type="search"
                id="searchBlog"
                placeholder="Search by title, keyword, category or writer...">

        </div>


        <div class="filter-wrapper">

            <select id="statusFilter">

                <option value="All">
                    All Statuses
                </option>

                <option value="Idea">
                    Idea
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Under Review">
                    Under Review
                </option>

                <option value="Scheduled">
                    Scheduled
                </option>

                <option value="Published">
                    Published
                </option>

            </select>

        </div>

    </section>



    <!-- =========================================
         BLOG TABLE
    ========================================= -->

    <section class="blog-table-card">

        <div class="table-header">

            <div>

                <h2>
                    All Blog Articles
                </h2>

                <p>
                    Manage your blog information and article content.
                </p>

            </div>

        </div>


        <div class="table-responsive">

            <table id="blogTable">

                <thead>

                    <tr>

                        <th>
                            Title
                        </th>

                        <th>
                            Keyword
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Writer
                        </th>

                        <th>
                            Words
                        </th>

                        <th>
                            Publishing Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="blogTableBody">

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- =========================================
     SCRIPTS
========================================= -->

<script src="js/storage.js"></script>

<script src="js/app.js"></script>

<script src="js/blogs.js"></script>


</body>

</html>
